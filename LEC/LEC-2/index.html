<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- font-family link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<style>
    * {
        font-family: "Montserrat", sans-serif;
        background-color: #DDDDDD;
    }

    .box {
        border: 2px solid black;
        width: 250px;
        height: 50px;
        text-align: center;
        padding-top: 10px;
        margin-top: 10px;
        background-color: blueviolet;
        color: white;
        font-size: 1.2rem;
        border-radius: 4%;
        box-shadow: rgba(0, 0, 0, 0.19) 0px 10px 20px, rgba(0, 0, 0, 0.23) 0px 6px 6px;
    }

    button {
        padding: 10px 18px;
        margin: 6px;
        font-size: 15px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #fff;
        background-color: #3498db;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
        background-color: #2980b9;
        transform: scale(1.05);
    }

    button:active {
        background-color: #1f618d;
        transform: scale(0.98);
    }
</style>

<body>
    <!-- FadeEfect buttons -->
    <button id="FadeIn">FadeIn</button>
    <button id="FadeOut">FadeOut</button> <button id="FadeOut-callBack">FadeOut-callBack</button>
    <button id="FadeToggle">FadeToggle</button>
    <button id="FadeTo">FadeTo</button>
    <button id="FadeTo-callBack">FadeTo-callBack </button>
    <!-- SlideEfect buttons -->
    <button id="slideUp">slideUp</button>
    <button id="slideToggle">slideToggle</button>
    <button id="slideDown">slideDown</button>
    <!-- Animate buttons -->
    <button id="Aniamte">Animate</button>
    <button id="Animate-Reset">Animate-Reset</button>
    <!-- JQuery Get Method -->
    <button id="html">html</button>
    <!-- J-Query Set Method -->
    <button id="text">text</button>
    <!-- J-Query Value -->
    <button id="value">Value</button>
    <!-- content -->
    <div class="box1 box">box-1</div>
    <div class="box2 box">box-2</div>
    <div class="box3 box">box-3</div>
    <div class="box4 box">box-4</div>
    <!-- Get Method content -->
    <div>
        <h1>Get Method</h1>
        <h3 id="heading">This is Heading!! <br>
            <span>This is span Tag</span>
        </h3>
    </div>
    <!-- set Method content -->
    <div>
        <h1>Text Method</h1>
        <h3 id="heading-text">This is Set Heading!! <br>
            <span>This is second span tag!!</span>
            </h1>
    </div>
    <!-- value Method -->
    <div>
        <h1>Value Method</h1>
        <input type="text" placeholder="Enter Something..">
    </div>

</body>
<script src="/jQuery/jquery.js"></script>
<script src="./index.js"></script>

</html>
