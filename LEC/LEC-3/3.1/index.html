<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- fonts link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<style>
    * {
        font-family: "Poppins", sans-serif;
        font-weight: 500;
    }

    .container {
        border: 2px solid black;
        width: 150px;
        height: 150px;
        transition: all 0.5s ease-in-out;
        background-color: brown;
    }

    .box {
        border-radius: 100px;
        background-color: blueviolet;
        transition: all 0.5s ease-in-out;
    }

    .dimesion {
        border: 2px solid black;
        height: 200px;
        width: 200px;
        background-color: #7AE2CF;
    }
</style>

<body>
    <!-- jQuery Add method -->
    <div>
        <hr>
        <!-- prepend-btn -->
        <button id="pre-btn">Prepend</button>
        <!-- append-btn -->
        <button id="app-btn">Append</button>
        <!-- after-btn -->
        <button id="af-btn">After</button>
        <!-- before-btn -->
        <button id="be-btn">Before</button>
        <hr>
        <!-- prepend,Append,after,before-btn method Content -->
        <p id="prepend"> Test Add method!!</p>
    </div>
    <hr>

    <!-- jQuery Remove method -->
    <div>
        <!-- Remove-btn -->
        <button id="Remove-btn">Remove</button>
        <button id="Empty-btn">Empty</button>
        <button id="em-target">Empty-Target</button>
        <hr>
        <!-- Remove method Content -->
        <p class="remove-content"> Test Remove method!! <br>
            <span class="em-tar">This is Empty-Target Content!!</span>
        </p>
    </div>
    <hr>

    <!-- jquery Class method -->
    <div>
        <!-- add class-btn -->
        <button id="add-btn">AddClass</button>
        <!-- Remove Class-btn -->
        <button id="Re-btn">RemoveClass</button>
        <!-- Toggle Class-btn -->
        <button id="toggle-btn">ToggleClass</button>
        <hr>

        <!-- class method content -->
        <div class="container"></div>
    </div>
    <hr>

    <!-- jQuery Dimension method -->
    <div>
        <!-- height-btn -->
        <button id="height-btn">Height</button>
        <!-- width-btn -->
        <button id="width-btn">width</button>
        <hr>

        <!-- DimensionContent -->
        <div class="dimesion"></div>
    </div>

</body>
<script src="/jQuery/jquery.js"></script>
<script src="./index.js"></script>

</html>
