<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* Style for the container */
    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 30px;
        background-color: #f9f9f9;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        font-family: Arial, sans-serif;
        text-align: center;
    }

    /* Heading */
    .container h1 {
        margin-bottom: 20px;
        font-size: 24px;
        color: #333;
    }

    /* Textarea styling */
    #textfiled {
        width: 100%;
        height: 150px;
        padding: 15px;
        font-size: 16px;
        resize: none;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    /* Button styling */
    #btn {
        margin-top: 20px;
        padding: 10px 25px;
        font-size: 16px;
        color: white;
        background-color: #007bff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    span#copied {
        /* border: 2px solid black; */
        display: block;
        transform: scale(0);
        margin-top: 10px;
        font-size: 1.8rem;
    }

    #btn:hover {
        background-color: #0056b3;
    }

    span.bounce-effect {
        animation: bounceIn 0.8s linear;
    }

    /* BounceIn Animation */

    @keyframes bounceIn {
        0% {
            opacity: 0;
            transform: scale(0.3);
        }

        20% {
            transform: scale(1.1);
        }

        40% {
            transform: scale(0.9);
        }

        60% {
            opacity: 1;
            transform: scale(1.03);
        }

        80% {
            transform: scale(0.97);
        }

        100% {
            opacity: 1;
            transform: scale(1);
        }
    }
</style>

<body>
    <div class="container">
        <h1>Copy to clipborad</h1>
        <textarea id="textfiled">
            To AnyType to Copied Here..
        </textarea>
        <button id="btn">Copy</button>
        <span id="copied">Copied..</span>
    </div>
</body>
<script src="/jQuery/jquery.js"></script>
<script>
    $(document).ready(function () {
        // make two function to add and remove the class in the span
        function add() {
            $("#copied").addClass("bounce-effect")
        }
        function remove() {
            $("#copied").removeClass("bounce-effect")
        }

        // call the function and copy the text on button click

        $("#btn").click(function () {
            $("#textfiled").select()
            document.execCommand("copy")
            add()
            setTimeout(remove, 800)
        })
    })

</script>

</html>
